<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hosted Docking Portal{% endblock %}</title>
    <link rel="stylesheet" href="{{ absolute_url_for('static', filename='css/portal.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body data-active-release="{{ active_release|default('', true) }}" data-base-url="{{ portal_base_url }}">
    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="{{ absolute_url_for('pages.index') }}">Hosted Docking Portal</a>
            <nav class="site-nav">
                <a href="{{ absolute_url_for('pages.index') }}">Releases</a>
                <a href="{{ absolute_url_for('pages.jobs_history_view') }}">Jobs</a>
                <a href="{{ absolute_url_for('pages.projects_view') }}">Projects</a>
                <a href="{{ absolute_url_for('pages.operations_view') }}">Operations</a>
                <a href="{{ absolute_url_for('api_datasets.api_health') }}">API Health</a>
            </nav>
        </div>
    </header>
    <main class="wrap">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ absolute_url_for('static', filename='js/portal.js') }}"></script>
</body>
</html>
