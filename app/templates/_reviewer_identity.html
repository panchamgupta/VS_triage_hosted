<div id="reviewer-identity-shell" class="reviewer-identity-shell" data-reviewer-shell>
    <div class="reviewer-identity-empty" data-reviewer-empty>
        <label class="smalltxt" for="reviewer-name-input">Enter Your Name</label>
        <div class="reviewer-identity-form">
            <input id="reviewer-name-input" type="text" maxlength="120" placeholder="Pancham Gupta" data-reviewer-input>
            <button type="button" class="hosted-btn" data-reviewer-save>Save Reviewer Name</button>
        </div>
    </div>
    <div class="reviewer-identity-active hidden" data-reviewer-active>
        <span class="smalltxt">Reviewing as</span>
        <strong data-reviewer-name></strong>
        <button type="button" class="hosted-btn hosted-btn-secondary" data-reviewer-edit>Change Name</button>
    </div>
</div>
